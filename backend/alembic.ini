# Alembic na linha de comandos (ex.: uv run alembic revision --autogenerate -m "...").
# A API aplica as migrações sozinha quando arranca (app/migrate.py).
# O URL da base de dados vem de DATABASE_URL (app/config.py), não deste ficheiro.

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
